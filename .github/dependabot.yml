version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      aws:
        patterns:
          - "github.com/aws/*"
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: "/backend/infra/terraform"
    schedule:
      interval: weekly
