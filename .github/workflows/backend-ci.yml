name: Backend CI

# backend/go.mod replaces github.com/optiqor/optiqor-cli with ../, so CLI
# changes under pkg/ can break the backend too.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pkg/**"
      - "brand/**"
      - "docs/api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pkg/**"
      - "brand/**"
      - "docs/api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          diff=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$diff" ]; then echo "gofmt would rewrite:"; echo "$diff"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

  test:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  build:
    name: Backend build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - run: make build

  terraform-tags:
    name: Terraform tag check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify default_tags block on every env
        run: bash scripts/check-terraform-tags.sh

  openapi-parity:
    name: OpenAPI ↔ handler parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert every spec path is wired and vice versa
        run: bash scripts/check-openapi-parity.sh

  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - run: terraform -chdir=infra/terraform fmt -recursive -check
