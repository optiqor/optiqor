name: CI

# Workspace layout this workflow assumes:
#
#   $GITHUB_WORKSPACE/
#     optiqor/          ← this repo
#     optiqor-cli/      ← Apache-2.0 OSS CLI (public per OSS playbook)
#
# The optiqor backend's go.mod has `replace github.com/optiqor/optiqor-cli =>
# ../optiqor-cli`. CI checks out both repos as siblings so that path
# resolves; every Go step then sets `working-directory: optiqor`.
#
# If `optiqor-cli` ever becomes private, set the `OPTIQOR_BOT_TOKEN`
# repo secret to a PAT with `contents:read` on the CLI repo and pass
# it to the second checkout via `token:`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared anchor — every job that runs Go reuses this same dual-checkout
# pattern. YAML anchors keep the diff readable.
defaults:
  run:
    working-directory: optiqor

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out optiqor backend
        uses: actions/checkout@v5
        with:
          path: optiqor
      - name: Check out optiqor-cli sibling (for go.mod replace)
        uses: actions/checkout@v5
        with:
          repository: optiqor/optiqor-cli
          path: optiqor-cli
          token: ${{ secrets.OPTIQOR_BOT_TOKEN || github.token }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: optiqor/go.sum
      - name: gofmt
        run: |
          diff=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$diff" ]; then echo "gofmt would rewrite:"; echo "$diff"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: optiqor

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out optiqor backend
        uses: actions/checkout@v5
        with:
          path: optiqor
      - name: Check out optiqor-cli sibling
        uses: actions/checkout@v5
        with:
          repository: optiqor/optiqor-cli
          path: optiqor-cli
          token: ${{ secrets.OPTIQOR_BOT_TOKEN || github.token }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: optiqor/go.sum
      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out optiqor backend
        uses: actions/checkout@v5
        with:
          path: optiqor
      - name: Check out optiqor-cli sibling
        uses: actions/checkout@v5
        with:
          repository: optiqor/optiqor-cli
          path: optiqor-cli
          token: ${{ secrets.OPTIQOR_BOT_TOKEN || github.token }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: optiqor/go.sum
      - run: make build

  terraform-tags:
    name: Terraform tag check
    runs-on: ubuntu-latest
    steps:
      - name: Check out optiqor backend
        uses: actions/checkout@v5
        with:
          path: optiqor
      - name: Verify default_tags block on every env
        run: bash scripts/check-terraform-tags.sh

  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out optiqor backend
        uses: actions/checkout@v5
        with:
          path: optiqor
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - run: terraform -chdir=infra/terraform fmt -recursive -check
