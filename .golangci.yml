run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam

linters-settings:
  gosec:
    excludes:
      - G104   # let errcheck handle unhandled errors
  errcheck:
    check-type-assertions: true
  gocritic:
    enabled-tags: [diagnostic, performance, style]

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
  max-issues-per-linter: 0
  max-same-issues: 0
