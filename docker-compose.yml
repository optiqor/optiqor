services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: optiqor-postgres
    environment:
      POSTGRES_USER: optiqor
      POSTGRES_PASSWORD: optiqor
      POSTGRES_DB: optiqor
    ports:
      - "5432:5432"
    volumes:
      - optiqor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiqor -d optiqor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: optiqor-redis
    ports:
      - "6379:6379"
    volumes:
      - optiqor-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: optiqor-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: optiqor
      POSTGRES_PWD: optiqor
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: optiqor-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: optiqor-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  optiqor-postgres-data:
  optiqor-redis-data:
