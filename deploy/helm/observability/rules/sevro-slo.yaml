# Sevro SLO recording rules + alerts.
#
# These materialise the targets committed in backend/todo.md and the
# strategy doc amendments so dashboards and PagerDuty integration both
# read the same numbers.
#
# Year-1 targets:
#   - API availability: 99.5%
#   - PR comment latency: p95 < 45s (Phase 4 → < 30s)
#   - Sandbox latency: p95 < 3s
#   - Cost per PR: < $0.40
#   - Apply Fix success rate: > 85%

groups:
  - name: sevro_slo_recordings
    interval: 30s
    rules:
      # API availability — fraction of non-5xx responses.
      - record: sevro:api_availability:5m
        expr: |
          1 - (
            sum(rate(sevro_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(sevro_http_requests_total[5m]))
          )

      # API request latency — p95 over a rolling 5-minute window.
      - record: sevro:api_request_duration_seconds:p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(sevro_http_request_duration_seconds_bucket[5m]))
          )

      # PR-comment-pipeline latency — p95 across the whole flow.
      - record: sevro:pr_comment_latency_seconds:p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(sevro_pr_comment_duration_seconds_bucket[5m]))
          )

      # Sandbox latency — p95.
      - record: sevro:sandbox_duration_seconds:p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(sevro_sandbox_duration_seconds_bucket[5m]))
          )

      # LLM cost per PR — running 1h average.
      - record: sevro:llm_cost_per_pr_usd:1h
        expr: |
          sum(increase(sevro_llm_cost_usd_total[1h]))
          /
          sum(increase(sevro_pr_analyzed_total[1h]))

      # Apply Fix success — fraction not auto-rolled-back within 7d.
      - record: sevro:apply_fix_success_rate:7d
        expr: |
          1 - (
            sum(increase(sevro_apply_fix_rollback_total[7d]))
            /
            sum(increase(sevro_apply_fix_merged_total[7d]))
          )

  - name: sevro_slo_alerts
    rules:
      - alert: SevroAPIAvailabilityBelowSLO
        expr: sevro:api_availability:5m < 0.995
        for: 10m
        labels:
          severity: critical
          slo: api-availability
        annotations:
          summary: "Sevro API availability {{ $value | humanizePercentage }} (SLO 99.5%)"

      - alert: SevroPRCommentLatencyTooHigh
        expr: sevro:pr_comment_latency_seconds:p95:5m > 45
        for: 10m
        labels:
          severity: warning
          slo: pr-comment-latency
        annotations:
          summary: "PR comment p95 {{ $value }}s exceeds 45s target"

      - alert: SevroSandboxLatencyTooHigh
        expr: sevro:sandbox_duration_seconds:p95:5m > 3
        for: 5m
        labels:
          severity: warning
          slo: sandbox-latency
        annotations:
          summary: "Sandbox p95 {{ $value }}s exceeds 3s target"

      - alert: SevroLLMCostPerPRTooHigh
        expr: sevro:llm_cost_per_pr_usd:1h > 0.40
        for: 30m
        labels:
          severity: warning
          slo: cost-per-pr
        annotations:
          summary: "Cost/PR {{ $value | printf \"%.2f\" }} USD exceeds $0.40 target"

      - alert: SevroApplyFixSuccessTooLow
        expr: sevro:apply_fix_success_rate:7d < 0.85
        for: 1h
        labels:
          severity: critical
          slo: apply-fix-success
        annotations:
          summary: "Apply Fix success {{ $value | humanizePercentage }} below 85% target"
