# Loki — single-binary mode in Phase 1 (small team, low log volume).
# Switch to scalable mode at the first $1M-ARR milestone.

loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: true
    storageClassName: gp3
    size: 50Gi
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h # 30 days; matches docs/legal retention for LLM call logs
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_streams_per_user: 0

promtail:
  enabled: true
  config:
    snippets:
      pipelineStages:
        - cri: {}
        - match:
            selector: '{namespace="sevro-system"}'
            stages:
              - json:
                  expressions:
                    tenant_id:    tenant_id
                    workspace_id: workspace_id
                    request_id:   request_id
                    workflow_id:  workflow_id
              - labels:
                  tenant_id:
                  workspace_id:
                  request_id:
                  workflow_id:
