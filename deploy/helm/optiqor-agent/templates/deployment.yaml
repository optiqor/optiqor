apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "optiqor-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiqor-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "optiqor-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "optiqor-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "optiqor-agent.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--cluster-id=$(OPTIQOR_CLUSTER_ID)"
            - "--health-addr=:{{ .Values.health.port }}"
          env:
            - name: OPTIQOR_TENANT_ID
              value: {{ required ".Values.tenantID is required" .Values.tenantID | quote }}
            - name: OPTIQOR_CLUSTER_ID
              value: {{ required ".Values.clusterID is required" .Values.clusterID | quote }}
            - name: OPTIQOR_INGEST_URL
              value: {{ .Values.ingest.url | quote }}
            - name: OPTIQOR_SNAPSHOT_INTERVAL
              value: {{ default "60s" .Values.ingest.snapshotInterval | quote }}
            - name: OPTIQOR_EVENTS_CUTOFF
              value: {{ default "10m" .Values.ingest.eventsCutoff | quote }}
            {{- if .Values.prometheus.url }}
            - name: OPTIQOR_PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mtls
              mountPath: /var/run/optiqor/mtls
              readOnly: true
      volumes:
        - name: mtls
          secret:
            secretName: {{ .Values.ingest.secretName }}
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
