image:
  repository: ghcr.io/optiqor/agent
  tag: ""
  pullPolicy: IfNotPresent

# tenantID is set by the install wizard (web/src/app/install/*) and
# baked into the deployment ENV. The agent uses it as the keyspace
# prefix and the per-tenant Temporal queue routing key.
tenantID: ""

# clusterID is the stable identifier the workload-identity hash uses
# (ADR-0004). Pin per cluster; never rotate (a fresh clusterID
# orphans every recommendation history).
clusterID: ""

# Health probe port — kubelet hits /healthz here, separate from the
# Prometheus metrics port so RBAC for Prometheus stays narrow.
health:
  port: 8088

# Backend ingest endpoint. mTLS material lives in the secret named
# below; Phase 5 fills the certs.
ingest:
  url: "https://ingest.optiqor.dev"
  secretName: optiqor-agent-mtls
  # snapshotInterval controls how often the agent POSTs a full snapshot.
  # 60s is the floor — informers serve reads from memory, so a shorter
  # interval doesn't lower latency, only egress cost.
  snapshotInterval: 60s
  # eventsCutoff drops events older than this from each snapshot to
  # bound payload size after the event cache has grown.
  eventsCutoff: 10m

# Prometheus query endpoint. Empty disables agent-side scraping (the
# K8s informer signals still ship). Defaults to the kube-prometheus-stack
# in-cluster Service so a stock install lights up without overrides.
prometheus:
  url: "http://prometheus-operated.monitoring:9090"

# Read-only RBAC scope per ADR-0008. Adding a verb here changes the
# agent's security posture; needs an ADR amendment.
rbac:
  create: true
  verbs:
    - get
    - list
    - watch

serviceAccount:
  create: true
  name: ""

# Footprint defaults are deliberately tight; ADR-0008 + customer
# security review depend on the agent staying invisible at scale.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# NetworkPolicy denies all inbound and only allows egress to the
# ingest URL. ADR-0008 principle 2.
networkPolicy:
  enabled: true

# Prometheus scrape; the agent surfaces its own /metrics on :9090.
metrics:
  enabled: true
  port: 9090

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
