# OpenTelemetry Collector — fan-in for traces and metrics from the
# api/worker binaries. The agents emit OTLP/HTTP to this collector,
# which then writes traces to Tempo and exposes metrics for scrape.

mode: deployment
replicaCount: 2

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 512

  exporters:
    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
    debug:
      verbosity: basic
    prometheus:
      endpoint: 0.0.0.0:8889
      enable_open_metrics: true

  service:
    telemetry:
      logs:
        level: info
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
